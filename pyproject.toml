[project]
name = "dogcad"
version = "0.1.0"
description = "DogCAD 2D Lite — desktop CAD application"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.5",
    "ezdxf>=1.1",
]

[project.scripts]
dogcad = "src.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
